name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6 AM UTC
  pull_request:
    paths:
      - "frontend/package.json"
      - "frontend/bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad489e2bf5d77ba4c6e6ab11e8e9fc24e4 # v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run npm audit
        run: |
          npx npm-audit --audit-level=high || {
            echo "⚠️ High or critical vulnerabilities found!"
            exit 1
          }

      - name: Check for outdated dependencies
        run: |
          echo "## 📋 Dependency Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          bun outdated || true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f079b8493333aace61c81488f8bd40919487bd9f # v3.28.15
        with:
          languages: typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f079b8493333aace61c81488f8bd40919487bd9f # v3.28.15
