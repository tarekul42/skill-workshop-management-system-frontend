name: Security Audit

on:
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6 AM UTC
  pull_request:
    paths:
      - "package.json"
      - "bun.lock"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run dependency audit
        continue-on-error: true
        run: |
          bun audit --audit-level=high || {
            echo "⚠️ High or critical vulnerabilities found!"
            echo "Note: Non-blocking — audit report only."
          }

      - name: Check for outdated dependencies
        run: |
          echo "## 📋 Dependency Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          bun outdated || true

  # CodeQL analysis is handled by the default setup enabled in repository settings.
  # This workflow only covers dependency auditing to avoid conflicts.
