name: Deploy Production — Frontend

on:
  push:
    branches: [master, main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-production.yml"

concurrency:
  group: deploy-production-frontend
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  # Only deploy if all CI checks passed
  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    steps:
      - name: Check CI Status
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              per_page: 10
            });
            const ciRun = runs.data.check_runs.find(r => r.name === 'CI — Frontend');
            if (!ciRun || ciRun.status !== 'completed' || ciRun.conclusion !== 'success') {
              core.setFailed('CI pipeline has not passed yet');
            }

  deploy-production:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    needs: check-ci
    timeout-minutes: 15
    environment:
      name: production
      url: https://skill-workshop-management-system.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Build with Vercel
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend
        env:
          NEXT_PUBLIC_BACKEND_API_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_API_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Deploy to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: frontend

      - name: Verify Deployment
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }})
          if [ "$status" -ne 200 ]; then
            echo "❌ Deployment verification failed! Status: $status"
            exit 1
          fi
          echo "✅ Deployment verified successfully!"

      - name: Notify Deployment
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Production deployment successful"
          else
            echo "❌ Production deployment failed — investigate immediately"
          fi
